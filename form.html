<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review Form | WDD 131</title>
  <meta name="description" content="Submit a product review with rating, installation date, useful features, and feedback for WDD 131 Dynamic Web Fundamentals.">
  <meta name="author" content="Sergio Efrain Moscoso Gaviria">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Rate a Product</h1>
  </header>

  <main>
    <form method="get" action="review.html" class="review-form">
      <p class="required-note"><span class="required-mark" aria-hidden="true">*</span> Indicates a required field</p>

      <div class="form-group">
        <label for="product-name">Product Name <span class="required-mark" aria-hidden="true">*</span></label>
        <select id="product-name" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="form-group rating-fieldset">
        <legend>Overall Rating <span class="required-mark" aria-hidden="true">*</span></legend>
        <div class="rating-group">
          <div class="rating-option">
            <label for="rating-1">&star;</label>
            <input type="radio" id="rating-1" name="rating" value="1" required>
          </div>
          <div class="rating-option">
            <label for="rating-2">&star;&star;</label>
            <input type="radio" id="rating-2" name="rating" value="2" required>
          </div>
          <div class="rating-option">
            <label for="rating-3">&star;&star;&star;</label>
            <input type="radio" id="rating-3" name="rating" value="3" required>
          </div>
          <div class="rating-option">
            <label for="rating-4">&star;&star;&star;&star;</label>
            <input type="radio" id="rating-4" name="rating" value="4" required>
          </div>
          <div class="rating-option">
            <label for="rating-5">&star;&star;&star;&star;&star;</label>
            <input type="radio" id="rating-5" name="rating" value="5" required>
          </div>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="install-date">Date of Installation <span class="required-mark" aria-hidden="true">*</span></label>
        <input type="date" id="install-date" name="installDate" required>
      </div>

      <fieldset class="form-group checkbox-fieldset">
        <legend>Which features did you find useful in the product? <span class="optional-note">(Check all that apply)</span></legend>
        <div class="checkbox-list">
          <label class="checkbox-item" for="feature-durability">
            <input type="checkbox" id="feature-durability" name="features" value="Durability">
            <span>Durability</span>
          </label>
          <label class="checkbox-item" for="feature-ease">
            <input type="checkbox" id="feature-ease" name="features" value="Ease of Use">
            <span>Ease of Use</span>
          </label>
          <label class="checkbox-item" for="feature-performance">
            <input type="checkbox" id="feature-performance" name="features" value="Performance">
            <span>Performance</span>
          </label>
          <label class="checkbox-item" for="feature-design">
            <input type="checkbox" id="feature-design" name="features" value="Design">
            <span>Design</span>
          </label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="written-review">Written Review <span class="optional-note">(Optional)</span></label>
        <textarea id="written-review" name="writtenReview" rows="4" placeholder="Share your experience with this product..."></textarea>
      </div>

      <div class="form-group">
        <label for="user-name">Your Name <span class="optional-note">(Optional)</span></label>
        <input type="text" id="user-name" name="userName" autocomplete="name">
      </div>

      <div class="form-group">
        <input type="submit" value="Submit" class="submit-btn">
      </div>
    </form>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> &bull; Sergio Efrain Moscoso Gaviria &bull; Colombia</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
